# アプリごとのupstream。新しいアプリを追加したらここに追記する
upstream go_game {
    server go-game:8080;
}
# upstream go_app2 {
#     server go-app2:8080;
# }

server {
    listen 80;
    server_name localhost;

    # 本番(go.keisuke-nagaoka.com)と同じく、パス単位でアプリを振り分ける
    location /go-game/ {
        proxy_pass http://go_game/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # location /go-app2/ {
    #     proxy_pass http://go_app2/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}

server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    location /go-game/ {
        proxy_pass http://go_game/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # location /go-app2/ {
    #     proxy_pass http://go_app2/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
